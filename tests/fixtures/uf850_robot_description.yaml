      "radius": 0.06
    - "center": [0.075, 0.0, 0.0]     # the forearm is an L: 0.15 m stub, then 0.426 m
      "radius": 0.06
    - "center": [0.15, 0.0, 0.0]
      "radius": 0.06
    - "center": [0.15, 0.055, 0.0]
