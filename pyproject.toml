[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rt_depth_tracker"
version = "0.1.0"
description = "Realtime people tracker on depth images: OSC depth frames in, one attention target and per-track rows out. Perception only; it never commands a robot."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "ATONATON, LLC" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "python-osc>=1.8",
    "pyyaml>=6.0",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
capture = ["pyorbbecsdk2>=2.0"]
viewer = ["glfw>=2.6", "PyOpenGL>=3.1", "imgui-bundle>=1.3", "matplotlib>=3.8"]

[project.scripts]
rt-tracker = "rt_depth_tracker.run:main"
rt-capture = "rt_depth_tracker.capture:main"
rt-calib = "rt_depth_tracker.calib_tool:main"
rt-ctl = "rt_depth_tracker.ctl:main"
rt-replay = "rt_depth_tracker.replay:main"
rt-viewer = "rt_depth_tracker.viewer:main"
rt-viz = "rt_depth_tracker.viz:main"

[tool.setuptools.packages.find]
where = ["src"]
